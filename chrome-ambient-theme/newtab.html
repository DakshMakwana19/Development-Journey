<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Tab — Ambient Aura</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&family=Outfit:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <!-- Ambient Background Layer -->
  <div class="ambient-bg">
    <div class="gradient-orb orb-1"></div>
    <div class="gradient-orb orb-2"></div>
    <div class="gradient-orb orb-3"></div>
    <div class="gradient-orb orb-4"></div>
    <div class="gradient-orb orb-5"></div>
    <div class="gradient-orb orb-6"></div>
    <canvas id="particleCanvas"></canvas>
  </div>

  <!-- Light Rays -->
  <div class="light-rays">
    <div class="ray ray-1"></div>
    <div class="ray ray-2"></div>
    <div class="ray ray-3"></div>
  </div>

  <!-- Noise Texture Overlay -->
  <div class="noise-overlay"></div>

  <!-- Main Content -->
  <main class="content">
    <!-- Top Bar -->
    <header class="top-bar">
      <div class="greeting" id="greeting"></div>
      <div class="top-right">
        <button class="settings-btn" id="settingsBtn" title="Settings">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Clock Section -->
    <section class="clock-section">
      <div class="clock-container">
        <div class="time" id="time">00:00</div>
        <div class="date" id="date">Loading...</div>
      </div>
    </section>

    <!-- Search Bar -->
    <section class="search-section">
      <div class="search-container">
        <div class="search-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="M21 21l-4.35-4.35"></path>
          </svg>
        </div>
        <input type="text" class="search-input" id="searchInput" placeholder="Search the web..." autocomplete="off" autofocus>
        <div class="search-shortcut">
          <kbd>Enter</kbd>
        </div>
      </div>
    </section>

    <!-- Quick Links -->
    <section class="links-section">
      <div class="links-grid" id="linksGrid">
        <!-- Links populated by JS -->
      </div>
      <button class="add-link-btn" id="addLinkBtn" title="Add shortcut">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span>Add Shortcut</span>
      </button>
    </section>

    <!-- Quote Section -->
    <footer class="quote-section">
      <p class="quote-text" id="quoteText"></p>
      <p class="quote-author" id="quoteAuthor"></p>
    </footer>
  </main>

  <!-- Add Link Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h3 class="modal-title">Add Shortcut</h3>
      <div class="modal-field">
        <label>Name</label>
        <input type="text" id="linkName" placeholder="e.g. YouTube" autocomplete="off">
      </div>
      <div class="modal-field">
        <label>URL</label>
        <input type="text" id="linkUrl" placeholder="e.g. https://youtube.com" autocomplete="off">
      </div>
      <div class="modal-actions">
        <button class="modal-btn cancel" id="modalCancel">Cancel</button>
        <button class="modal-btn save" id="modalSave">Save</button>
      </div>
    </div>
  </div>

  <!-- Settings Panel -->
  <div class="settings-overlay" id="settingsOverlay">
    <div class="settings-panel">
      <div class="settings-header">
        <h3>Settings</h3>
        <button class="settings-close" id="settingsClose">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="settings-body">
        <div class="setting-group">
          <label class="setting-label">Your Name</label>
          <input type="text" class="setting-input" id="userName" placeholder="Enter your name">
        </div>
        <div class="setting-group">
          <label class="setting-label">Ambient Style</label>
          <div class="theme-options">
            <button class="theme-option active" data-theme="aurora" title="Aurora">
              <div class="theme-preview aurora-preview"></div>
              <span>Aurora</span>
            </button>
            <button class="theme-option" data-theme="neon" title="Neon">
              <div class="theme-preview neon-preview"></div>
              <span>Neon</span>
            </button>
            <button class="theme-option" data-theme="ember" title="Ember">
              <div class="theme-preview ember-preview"></div>
              <span>Ember</span>
            </button>
            <button class="theme-option" data-theme="void" title="Void">
              <div class="theme-preview void-preview"></div>
              <span>Void</span>
            </button>
            <button class="theme-option" data-theme="emerald" title="Emerald">
              <div class="theme-preview emerald-preview"></div>
              <span>Emerald</span>
            </button>
          </div>
        </div>
        <div class="setting-group">
          <label class="setting-label">Search Engine</label>
          <select class="setting-select" id="searchEngine">
            <option value="google">Google</option>
            <option value="bing">Bing</option>
            <option value="duckduckgo">DuckDuckGo</option>
          </select>
        </div>
        <div class="setting-group toggle-group">
          <label class="setting-label">Show Quotes</label>
          <label class="toggle">
            <input type="checkbox" id="showQuotes" checked>
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div class="setting-group toggle-group">
          <label class="setting-label">24-Hour Clock</label>
          <label class="toggle">
            <input type="checkbox" id="clock24h">
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div class="setting-group toggle-group">
          <label class="setting-label">Particles</label>
          <label class="toggle">
            <input type="checkbox" id="showParticles" checked>
            <span class="toggle-slider"></span>
          </label>
        </div>
      </div>
    </div>
  </div>

  <script src="newtab.js"></script>
</body>
</html>
